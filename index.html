er-radius:12px;padding:12px;font-size:14px;outline:none;background:#fff}input:focus,textarea:focus,select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(35,87,163,.12)}.filters input{max-width:380px}.filters select{max-width:260px}.board{display:grid;grid-template-columns:repeat(5,minmax(245px,1fr));gap:12px;align-items:start}.column{background:#eef2f7;border:1px solid #dbe2ea;border-radius:var(--radius);padding:12px;min-height:460px}.column.drag-over{outline:3px solid rgba(230,66,139,.28)}.column-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:900}.badge{border-radius:999px;color:white;font-size:11px;font-weight:900;padding:5px 8px}.st-os{background:var(--cyan)}.st-eng{background:var(--orange)}.st-cli{background:var(--purple)}.st-alt{background:var(--red)}.st-fin{background:var(--green)}.st-done{background:var(--gray)}.cards{min-height:370px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 8px 18px rgba(15,23,42,.06);cursor:grab}.card.prazo-ok{border-left:6px solid #10b981;background:#f0fdf4}.card.prazo-atrasado{border-left:6px solid #ef4444;background:#fff1f2}.deadline-pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.deadline-ok{background:#dcfce7;color:#166534}.deadline-late{background:#fee2e2;color:#991b1b}.card:active{cursor:grabbing}.card h3{margin:0 0 8px;color:var(--blue);font-size:15px;line-height:1.25}.meta{display:grid;gap:4px;color:#374151;font-size:12.5px;margin-bottom:8px}.meta b{color:#111827}.desc{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:9px;font-size:12.5px;line-height:1.35;white-space:pre-wrap;margin:8px 0;max-height:95px;overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px;border:1px dashed #cbd5e1;border-radius:14px;background:rgba(255,255,25 tical-align:top}.pdf-table td:nth-child(1){width:48px;text-align:center}.pdf-table td:nth-child(3){width:130px}.pdf-table td:nth-child(4){width:60px;text-align:center}.hidden{display:none!important}@media(max-width:1200px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.finished-grid{grid-template-columns:1fr}}@media(max-width:650px){h1{font-size:24px}.form-row,.form-row-3{grid-template-columns:1fr}.filters input,.filters select{max-width:100%}.stats{grid-template-columns:1fr}}

<header><div class="header-inner"><div><h1>Controle de Solicitações de ART</h1><p class="subtitle">Kanban online para solicitações, aprovações, alterações, financeiro e finalização de ARTs.</p></div><div class="header-actions"><button class="btn-primary" onclick="openCreate()">+ Nova solicitação de ART</button><button class="btn-light" onclick="exportCSV()">Exportar CSV</button><button class="btn-light" onclick="print()">Imprimir</button></div></div></header>
<main>
  <div class="stats"><div class="stat"><span>Nova ART</span><strong id="count_os">0</strong></div><div class="stat"><span>Finalizado Engenheiro</span><strong id="count_eng">0</strong></div><div class="stat"><span>Aguard. Cliente</span><strong id="count_cli">0</strong></div><div class="stat"><span>Alteração</span><strong id="count_alt">0</strong></div><div class="stat"><span>Financeiro</span><strong id="count_fin">0</strong></div><div class="stat"><span>Finalizadas</span><strong id="count_done">0</strong></div></div>
  <div class="filters"><input id="search" placeholder="Buscar por cliente, job, OS, rua, cidade, OC..." oninput="render()"/><select id="filterUf" onchange="render()"><option value="">Todos os UFs</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select></div>

</main>
<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-header"><h2 id="modalTitle">Nova solicitação de ART</h2><button class="btn-muted" onclick="closeModal()">Fechar</button></div><form id="artForm"><input type="hidden" id="editId"/><div class="tabs"><button type="button" class="tab active" onclick="showTab('dados')">Dados extraídos</button><button type="button" class="tab" onclick="showTab('pedido')">Texto do pedido</button><button type="button" class="tab" onclick="showTab('formulario')">Formulário instalação</button></div>
<div id="tab-dados" class="tab-content active"><div class="form-row"><div><label>Nome do cliente</label><input id="cliente" required placeholder="Ex: Bob's"/></div><div><label>Job</label><input id="job" placeholder="Ex: 4587 / BK Cambé"/></div></div><div class="form-row"><div><label>Ordem de compra do cliente</label><input id="ordemCompra" placeholder="Somente números"/></div><div><label>Status</label><select id="status"><option value="anexar_os">Nova ART</option><option value="aguardando_engenheiro">Finalizado Engenheiro</option><option value="aguardando_aprovacao_cliente">Aguardando Aprovação Cliente</option><option value="solicitacao_alteracao">Solicitação de alteração</option><option value="financeiro">Financeiro</option></select></div></div><div class="form-row-3"><div><label>Nome da rua</label><input id="rua"/></div><div><label>Nº</label><input id="numero"/></div><div><label>CEP</label><input id="cep"/></div></div><div class="form-row-3"><div><label>Cidade</label><input id="cidade"/></div><div><label>UF</label><input id="uf" maxlength="2"/></div><div><label>Observação</label><input id="observacao"/></div></div></div>
<div id="tab-pedido" class="tab-content"><label>Texto colado das informações do pedido</label><textarea id="textoPedido" placeholder="Cole aqui as informações do pedido. Esse texto será usado como segunda página do PDF gerado pelo sistema."></textarea></div>
<div id="tab-formulario" class="tab-content"><label>Texto colado do formulário de instalação</label><textarea id="textoFormulario" placeholder="Cole aqui todo o formulário de instalação. O sistema tentará extrair cliente, job, OC, endereço, CEP, cidade e UF."></textarea><button type="button" class="btn-muted" style="margin-top:10px" onclick="extractFromForm()">Extrair dados do formulário</button></div>
<button class="btn-dark" style="width:100%;margin-top:16px" type="submit">Salvar solicitação</button></form></div></div>
<div id="pdfArea" class="hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAvmkq8W92sO6ehIb6rB9fvqn_rCwVsGQE",authDomain:"controle-pendencias-d525e.firebaseapp.com",projectId:"controle-pendencias-d525e",storageBucket:"controle-pendencias-d525e.firebasestorage.app",messagingSenderId:"526501414683",appId:"1:526501414683:web:84370c06171ed8be94b5be",measurementId:"G-671442F78R"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const artsRef=collection(db,"solicitacoes_art_granda"); let arts=[];
const statuses=[{id:'anexar_os',title:'Nova ART',badge:'Nova',cls:'st-os'},{id:'aguardando_engenheiro',title:'Finalizado Engenheiro',badge:'ART',cls:'st-eng'},{id:'aguardando_aprovacao_cliente',title:'Aguardando Aprovação Cliente',badge:'Cliente',cls:'st-cli'},{id:'solicitacao_alteracao',title:'Solicitação de alteração',badge:'Alteração',cls:'st-alt'},{id:'financeiro',title:'Financeiro',badge:'Financeiro',cls:'st-fin'}];
function todayBR(){return new Date().toLocaleString('pt-BR')}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function onlyNums(v){return String(v||'').replace(/\D/g,'')}function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function cleanExtractedValue(v){return String(v||'').replace(/^[:\-–—\s]+/,'').replace(/\s{2,}/g,' ').trim()}
function getLineValue(text,keys){
  const rawLines=String(text||'').split(/\r?\n/);
  const lines=rawLines.map(l=>l.trim()).filter(Boolean);
  for(const key of keys){
    const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const reSame=new RegExp('^\\s*'+escaped+'\\s*(?:[:\\-–—]|=)?\\s*(.+)$','i');
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const m=line.match(reSame);
      if(m && cleanExtractedValue(m[1]) && norm(cleanExtractedValue(m[1]))!==norm(key)) return cleanExtractedValue(m[1]);
      const n=norm(line), k=norm(key);
      if(n===k || n.startsWith(k+':') || n.startsWith(k+' -') || n.startsWith(k+' –')){
        const after=line.slice(line.toLowerCase().indexOf(key.toLowerCase())+key.length);
        if(cleanExtractedValue(after)) return cleanExtractedValue(after);
        if(lines[i+1] && !keys.some(other=>norm(lines[i+1]).startsWith(norm(other)))) return cleanExtractedValue(lines[i+1]);
      }
    }
  }
  return ''
}
function getRegexValue(text,patterns){for(const pattern of patterns){const m=String(text||'').match(pattern);if(m&&m[1])return cleanExtractedValue(m[1])}return ''}
window.extractFromForm=function(){
  const t=document.getElementById('textoFormulario').value;
  const all=t.replace(/\s+/g,' ');
  function set(id,val){if(val!==undefined && val!==null && String(val).trim())document.getElementById(id).value=String(val).trim()}
  const cliente=getLineValue(t,['Nome do cliente','Cliente','Razão social','Razao social']) || getRegexValue(all,[/nome do cliente\s*[:\-–—]?\s*([^|;\n]+?)(?=\s+(?:job|ordem de compra|endereço|endereco|rua|cep|cidade|uf)\b|$)/i]);
  const job=getLineValue(t,['Job','JOB','Número do job','Numero do job','Nº job','N° job']) || getRegexValue(all,[/\bjob\s*[:\-–—]?\s*([A-Za-z0-9.\/_-]+)/i]);
  let oc=getLineValue(t,['Ordem de compra do cliente','Ordem de compra','OC','O.C.','Pedido de compra']);
  if(!oc) oc=getRegexValue(all,[/(?:ordem de compra do cliente|ordem de compra|pedido de compra|\boc\b|o\.c\.)\D{0,25}(\d[\d.\/-]*)/i]);
  const rua=getLineValue(t,['Nome da rua','Rua','Endereço','Endereco','Logradouro']) || getRegexValue(all,[/(?:nome da rua|endereço|endereco|logradouro|rua)\s*[:\-–—]?\s*([^,;|\n]+?)(?=\s+(?:n[º°o]|numero|número|cep|cidade|uf)\b|$)/i]);
  const numero=getLineValue(t,['Nº','N°','Número','Numero','N']) || getRegexValue(all,[/(?:n[º°o]?|número|numero)\s*[:\-–—]?\s*([0-9A-Za-z\/-]+)/i]);
  let cep=getLineValue(t,['CEP']);
  if(!cep){const m=all.match(/\b\d{5}-?\d{3}\b/);cep=m?m[0]:''}
  const cidade=getLineValue(t,['Cidade','Município','Municipio']) || getRegexValue(all,[/(?:cidade|município|municipio)\s*[:\-–—]?\s*([A-Za-zÀ-ÿ .'-]+?)(?=\s+(?:uf|estado|cep)\b|$)/i]);
  let uf=getLineValue(t,['UF','Estado']);
  if(!uf){const m=all.match(/\b(AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO)\b/i);uf=m?m[1]:''}
  set('cliente',cliente);set('job',job);set('ordemCompra',onlyNums(oc));set('rua',rua);set('numero',numero);set('cep',cep);set('cidade',cidade);set('uf',uf.toUpperCase().slice(0,2));
  showTab('dados')
}
window.showTab=function(name){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add('active');document.getElementById('tab-'+name).classList.add('active')}
function matches(a){const q=norm(document.getElementById('search').value);const uf=document.getElementById('filterUf').value;const hay=norm([a.cliente,a.job,a.ordemCompra,a.rua,a.numero,a.cep,a.cidade,a.uf,a.textoPedido,a.textoFormulario].join(' '));return(!q||hay.includes(q))&&(!uf||a.uf===uf)}
function cardHTML(a,done=false){const prazoClass=isLate(a)?'prazo-atrasado':'prazo-ok';return `<div class="card ${prazoClass}" draggable="${!done}" ondragstart="dragStart(event,'${a.id}')"><h3>${esc(a.cliente||'Cliente não informado')}</h3><div class="meta"><div><b>Job:</b> ${esc(a.job||'-')}</div><div><b>OC:</b> ${esc(a.ordemCompra||'-')}</div><div><b>Endereço:</b> ${esc([a.rua,a.numero].filter(Boolean).join(', ')||'-')}</div><div><b>Cidade/UF:</b> ${esc([a.cidade,a.uf].filter(Boolean).join(' / ')||'-')}</div><div><b>Criado em:</b> ${esc(a.criadoEm||'-')}</div>${a.artAnexadaNome?`<div><b>ART anexada:</b> ${esc(a.artAnexadaNome)}</div>`:''}<div><b>Prazo:</b> ${deadlineText(a)}</div>${done?`<div><b>Finalizado em:</b> ${esc(a.finalizadoEm||'-')}</div>`:''}</div>${a.observacao?`<div class="desc">${esc(a.observacao)}</div>`:''}<div class="actions">${!done?`<button class="btn-small btn-green" onclick="finishArt('${a.id}')">Finalizar</button>`:`<button class="btn-small btn-muted" onclick="reopenArt('${a.id}')">Reabrir</button>`}<button class="btn-small btn-muted" onclick="openEdit('${a.id}')">Editar</button><button class="btn-small btn-muted" onclick="generatePDF('${a.id}')">Gerar PDF cadastro</button><button class="btn-small btn-muted" onclick="selectAndMergeART('${a.id}')">Anexar ART e unir PDF</button><button class="btn-small btn-danger" onclick="deleteArt('${a.id}')">Excluir</button></div></div>`}
window.render=function(){const board=document.getElementById('board');board.innerHTML=statuses.map(s=>`<div class="column" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropCard(event,'${s.id}')"><div class="column-title">${s.title}<span class="badge ${s.cls}">${s.badge}</span></div><div class="cards" id="col_${s.id}"></div></div>`).join('');const filtered=arts.filter(matches);for(const s of statuses){const arr=filtered.filter(a=>!a.finalizado&&a.status===s.id);document.getElementById('col_'+s.id).innerHTML=arr.length?arr.map(a=>cardHTML(a)).join(''):'<div class="empty">Nenhuma solicitação nesta etapa.</div>';document.getElementById('count_'+({anexar_os:'os',aguardando_engenheiro:'eng',aguardando_aprovacao_cliente:'cli',solicitacao_alteracao:'alt',financeiro:'fin'}[s.id])).textContent=arts.filter(a=>!a.finalizado&&a.status===s.id).length}const done=filtered.filter(a=>a.finalizado);document.getElementById('finishedGrid').innerHTML=done.length?done.map(a=>cardHTML(a,true)).join(''):'<div class="empty">Nenhuma ART finalizada ainda.</div>';document.getElementById('count_done').textContent=arts.filter(a=>a.finalizado).length}
window.dragStart=(e,id)=>{e.dataTransfer.setData('text/plain',id)};window.dragOver=e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')};window.dragLeave=e=>e.currentTarget.classList.remove('drag-over');window.dropCard=async(e,status)=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');if(!id)return;await updateDoc(doc(db,'solicitacoes_art_granda',id),{status,alteradoEm:todayBR()})}
window.openCreate=function(){document.getElementById('modalTitle').textContent='Nova solicitação de ART';document.getElementById('artForm').reset();document.getElementById('editId').value='';showTab('dados');document.getElementById('modalBg').style.display='flex'};window.closeModal=()=>document.getElementById('modalBg').style.display='none';
window.openEdit=function(id){const a=arts.find(x=>x.id===id);if(!a)return;document.getElementById('modalTitle').textContent='Editar solicitação de ART';['cliente','job','ordemCompra','rua','numero','cep','cidade','uf','observacao','textoPedido','textoFormulario','status'].forEach(k=>document.getElementById(k).value=a[k]||'');document.getElementById('editId').value=id;showTab('dados');document.getElementById('modalBg').style.display='flex'}
document.getElementById('artForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const id=document.getElementById('editId').value;
  const item={
    cliente:document.getElementById('cliente').value.trim(),
    job:document.getElementById('job').value.trim(),
    ordemCompra:onlyNums(document.getElementById('ordemCompra').value),
    rua:document.getElementById('rua').value.trim(),
    numero:document.getElementById('numero').value.trim(),
    cep:document.getElementById('cep').value.trim(),
    cidade:document.getElementById('cidade').value.trim(),
    uf:document.getElementById('uf').value.trim().toUpperCase().slice(0,2),
    observacao:document.getElementById('observacao').value.trim(),
    textoPedido:document.getElementById('textoPedido').value.trim(),
    textoFormulario:document.getElementById('textoFormulario').value.trim(),
    status:document.getElementById('status').value,
    alteradoEm:todayBR()
  };

  const pdfItem={...item,criadoEm:todayBR(),prazoEntrega:isoDate(addBusinessDays(new Date(),5)),finalizado:false,finalizadoEm:''};

  try{
    if(id){
      await updateDoc(doc(db,'solicitacoes_art_granda',id),item);
    }else{
      await addDoc(artsRef,{...item,criadoEm:todayBR(),prazoEntrega:isoDate(addBusinessDays(new Date(),5)),criadoEmTimestamp:serverTimestamp(),finalizado:false,finalizadoEm:''});
    }
    closeModal();
  }catch(err){
    console.error('Erro Firebase:',err);
    alert('Não foi possível salvar no Firebase. Erro: '+(err.code||'')+' '+(err.message||''));
    return;
  }

  try{
    generatePDFFromData(pdfItem);
  }catch(err){
    console.error('Erro ao gerar PDF:',err);
    alert('A solicitação foi salva, mas houve erro ao gerar o PDF. Você pode gerar novamente pelo botão PDF do card.');
  }
});
window.finishArt=async id=>{await updateDoc(doc(db,'solicitacoes_art_granda',id),{finalizado:true,finalizadoEm:todayBR()})};window.reopenArt=async id=>{await updateDoc(doc(db,'solicitacoes_art_granda',id),{finalizado:false,finalizadoEm:''})};window.deleteArt=async id=>{if(confirm('Deseja excluir esta solicitação de ART?'))await deleteDoc(doc(db,'solicitacoes_art_granda',id))};
function parsePedidoItens(texto){
  const linhas=String(texto||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const blocos=[];
  let atual='';
  for(const linha of linhas){
    if(/^\d+\s+\.\.\./.test(linha) && atual){blocos.push(atual.trim());atual=linha}else{atual+=(atual?' ':'')+linha}
  }
  if(atual)blocos.push(atual.trim());
  return blocos.map(bloco=>{
    const itemMatch=bloco.match(/^(\d+)\s+\.\.\.\s*(.*)$/);
    if(!itemMatch)return null;
    let item=itemMatch[1];
    let texto=itemMatch[2].trim();
    texto=texto.replace(/\s+\d{1,3}(?:\.\d{3})*,\d{2}\s+R\$\s+\d{1,3}(?:\.\d{3})*,\d{2}\s*$/i,'').trim();
    texto=texto.replace(/\s+R\$\s*\d{1,3}(?:\.\d{3})*,\d{2}\s*$/i,'').trim();
    let qtde='';
    const qtdMatch=texto.match(/\s(\d+)\s*$/);
    if(qtdMatch){qtde=qtdMatch[1];texto=texto.slice(0,qtdMatch.index).trim()}
    let medida='';
    const medidaMatch=texto.match(/(\d+(?:[\.,]\d+)?\s*x\s*\d+(?:[\.,]\d+)?(?:\s*x\s*\d+(?:[\.,]\d+)?)?)\s*$/i);
    if(medidaMatch){medida=medidaMatch[1].replace(/\s*x\s*/gi,' x ');texto=texto.slice(0,medidaMatch.index).trim()}
    return {item,descricao:texto,medida,qtde};
  }).filter(Boolean);
}
function pedidoTableHTML(texto){
  const itens=parsePedidoItens(texto);
  if(!itens.length)return `<div class="pdf-text">${esc(texto||'')}</div>`;
  return `<table class="pdf-table"><thead><tr><th>Item</th><th>Descrição</th><th>Medida</th><th>Qtde</th></tr></thead><tbody>${itens.map(i=>`<tr><td>${esc(i.item)}</td><td>${esc(i.descricao)}</td><td>${esc(i.medida||'-')}</td><td>${esc(i.qtde||'-')}</td></tr>`).join('')}</tbody></table>`;
}
function pdfHTML(a){
  const statusTitle=esc((statuses.find(s=>s.id===a.status)||{}).title||'');
  return `<div class="pdf-page"><h1>Dados para Emissão da ART - Granda</h1><div class="pdf-grid"><div class="pdf-box"><div class="pdf-label">Cliente</div><div class="pdf-value">${esc(a.cliente)}</div></div><div class="pdf-box"><div class="pdf-label">Job</div><div class="pdf-value">${esc(a.job)}</div></div><div class="pdf-box"><div class="pdf-label">Ordem de compra</div><div class="pdf-value">${esc(a.ordemCompra)}</div></div><div class="pdf-box"><div class="pdf-label">Status</div><div class="pdf-value">${statusTitle}</div></div><div class="pdf-box"><div class="pdf-label">Endereço</div><div class="pdf-value">${esc([a.rua,a.numero].filter(Boolean).join(', '))}</div></div><div class="pdf-box"><div class="pdf-label">CEP / Cidade / UF</div><div class="pdf-value">${esc([a.cep,a.cidade,a.uf].filter(Boolean).join(' - '))}</div></div></div><h2>Informações do Pedido</h2>${pedidoTableHTML(a.textoPedido||'')}</div>`;
}
function generatePDFFromData(a){
  const area=document.getElementById('pdfArea');
  area.innerHTML=pdfHTML(a);
  area.classList.remove('hidden');
  html2pdf().set({margin:0,filename:`ART-${(a.cliente||'cliente').replace(/[^a-z0-9]/gi,'_')}-${a.job||''}.pdf`,image:{type:'jpeg',quality:.98},html2canvas:{scale:2},jsPDF:{unit:'px',format:[794,1123],orientation:'portrait'}}).from(area).save().then(()=>area.classList.add('hidden'));
}
window.generatePDF=function(id){const a=arts.find(x=>x.id===id);if(!a)return;generatePDFFromData(a)}

async function buildCadastroPdfBytes(a){
  const area=document.getElementById('pdfArea');
  area.innerHTML=pdfHTML(a);
  area.classList.remove('hidden');
  const worker=html2pdf().set({margin:0,image:{type:'jpeg',quality:.98},html2canvas:{scale:2},jsPDF:{unit:'px',format:[794,1123],orientation:'portrait'}}).from(area).toPdf();
  const bytes=await worker.outputPdf('arraybuffer');
  area.classList.add('hidden');
  return bytes;
}
async function mergePdfFiles(cadastroBytes, artBytes, filename){
  const merged=await PDFLib.PDFDocument.create();
  const artPdf=await PDFLib.PDFDocument.load(artBytes);
  const cadPdf=await PDFLib.PDFDocument.load(cadastroBytes);
  const artPages=await merged.copyPages(artPdf, artPdf.getPageIndices());
  artPages.forEach(p=>merged.addPage(p));
  const cadPages=await merged.copyPages(cadPdf, cadPdf.getPageIndices());
  cadPages.forEach(p=>merged.addPage(p));
  const pdfBytes=await merged.save();
  const blob=new Blob([pdfBytes],{type:'application/pdf'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=filename;
  link.click();
  URL.revokeObjectURL(link.href);
}
window.selectAndMergeART=function(id){
  const a=arts.find(x=>x.id===id);if(!a)return;
  const input=document.createElement('input');
  input.type='file';input.accept='application/pdf';
  input.onchange=async()=>{
    const file=input.files&&input.files[0];if(!file)return;
    try{
      const artBytes=await file.arrayBuffer();
      const cadastroBytes=await buildCadastroPdfBytes(a);
      const nome=`ART_COMPLETA-${(a.cliente||'cliente').replace(/[^a-z0-9]/gi,'_')}-${a.job||''}.pdf`;
      await mergePdfFiles(cadastroBytes,artBytes,nome);
      await updateDoc(doc(db,'solicitacoes_art_granda',id),{artAnexadaNome:file.name,artAnexadaEm:todayBR(),alteradoEm:todayBR()});
      alert('PDF unido gerado com sucesso. O nome do anexo também foi registrado no card.');
    }catch(err){console.error(err);alert('Não foi possível unir os PDFs. Confira se o arquivo anexado é um PDF válido.');}
  };
  input.click();
}

window.exportCSV=function(){const headers=['Cliente','Job','Ordem Compra','Rua','Numero','CEP','Cidade','UF','Status','Finalizado','Criado em'];const rows=arts.map(a=>[a.cliente,a.job,a.ordemCompra,a.rua,a.numero,a.cep,a.cidade,a.uf,a.status,a.finalizado?'Sim':'Nao',a.criadoEm]);const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='solicitacoes-art-granda.csv';link.click()}
