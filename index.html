r-radius:12px;padding:12px;font-size:14px;outline:none;background:#fff}input:focus,textarea:focus,select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(35,87,163,.12)}.filters input{max-width:380px}.filters select{max-width:260px}.board{display:grid;grid-template-columns:repeat(5,minmax(245px,1fr));gap:12px;align-items:start}.column{background:#eef2f7;border:1px solid #dbe2ea;border-radius:var(--radius);padding:12px;min-height:430px}.column.drag-over{outline:3px solid rgba(230,66,139,.28)}.column-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:900}.badge{border-radius:999px;color:white;font-size:11px;font-weight:900;padding:5px 8px}.st-os{background:var(--cyan)}.st-eng{background:var(--orange)}.st-cli{background:var(--purple)}.st-alt{background:var(--red)}.st-fin{background:var(--green)}.st-done{background:var(--gray)}.cards{min-height:340px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 8px 18px rgba(15,23,42,.06);cursor:grab}.card.prazo-ok{border-left:6px solid #10b981;background:#f0fdf4}.card.prazo-atrasado{border-left:6px solid #ef4444;background:#fff1f2}.deadline-pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.deadline-ok{background:#dcfce7;color:#166534}.deadline-late{background:#fee2e2;color:#991b1b}.card h3{margin:0 0 8px;color:var(--blue);font-size:15px;line-height:1.25}.meta{display:grid;gap:4px;color:#374151;font-size:12.5px;margin-bottom:8px}.meta b{color:#111827}.desc{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:9px;font-size:12.5px;line-height:1.35;white-space:pre-wrap;margin:8px 0;max-height:95px;overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px;border:1px dashed #cbd5e1;border-radius:14px;background:rgba(255,255,255,.55)}.finished-section{background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:18px}.finished-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.54);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{background:#fff;border-radius:22px;width:min(980px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.modal-header h2{margin:0;color:var(--blue)}label{display:block;font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted);margin:12px 0 6px;letter-spacing:.4px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}textarea{min-height:110px;resize:vertical}.tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}.tab{background:#eef2f7;color:#334155}.tab.active{background:var(--blue);color:white}.tab-content{display:none}.tab-content.active{display:block}.alert{margin-top:10px;padding:10px;border-radius:12px;font-size:13px;font-weight:700}.alert-ok{background:#dcfce7;color:#166534}.alert-warn{background:#fee2e2;color:#991b1b}.pdf-page{font-family:Arial,Helvetica,sans-serif;background:white;color:#111;padding:30px;width:794px;min-height:1123px}.pdf-page h1{color:#163b73;font-size:24px;border-bottom:2px solid #163b73;padding-bottom:10px;margin-bottom:18px}.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.pdf-box{border:1px solid #ddd;border-radius:10px;padding:10px}.pdf-label{font-size:11px;text-transform:uppercase;color:#666;font-weight:800}.pdf-value{font-size:15px;margin-top:4px}.pdf-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}.pdf-table th{background:#163b73;color:white;text-align:left;padding:8px;border:1px solid #163b73}.pdf-tabl <body>
<header><div class="header-inner"><div><h1>Controle de Solicitações de ART</h1><p class="subtitle">Kanban online para solicitações, aprovações, alterações, financeiro e finalização de ARTs.</p></div><div class="header-actions"><button class="btn-primary" onclick="openCreate()">+ Nova solicitação de ART</button><button class="btn-light" onclick="exportCSV()">Exportar CSV</button><button class="btn-light" onclick="print()">Imprimir</button></div></div></header>
<main>
  <div class="stats"><div class="stat"><span>Nova ART</span><strong id="count_os">0</strong></div><div class="stat"><span>Finalizado Engenheiro</span><strong id="count_eng">0</strong></div><div class="stat"><span>Aguard. Cliente</span><strong id="count_cli">0</strong></div><div class="stat"><span>Alteração</span><strong id="count_alt">0</strong></div><div class="stat"><span>Financeiro</span><strong id="count_fin">0</strong></div><div class="stat"><span>Finalizadas</span><strong id="count_done">0</strong></div></div>
  <div class="filters"><input id="search" placeholder="Buscar por cliente, job, OS, rua, cidade, CNPJ..." oninput="render()"/><select id="filterUf" onchange="render()"><option value="">Todos os UFs</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select></div>
  <section class="board" id="board"></section>
  <section class="finished-section"><h2>Finalizadas</h2><div id="finishedGrid" class="finished-grid"></div></section>
</main>
<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-header"><h2 id="modalTitle">Nova solicitação de ART</h2><button class="btn-muted" onclick="closeModal()">Fechar</button></div><form id="artForm"><input type="hidden" id="editId"/><div class="tabs"><button type="button" class="tab active" onclick="showTab('dados')">Dados extraídos</button><button type="button" class="tab" onclick="showTab('pedido')">Texto do pedido</button><button type="button" class="tab" onclick="showTab('formulario')">Formulário instalação</button></div>
<div id="tab-dados" class="tab-content active">
  <div class="form-row"><div><label>Nome do cliente</label><input id="cliente" required placeholder="Ex: Bob's"/></div><div><label>Job</label><input id="job" placeholder="Ex: 4587 / BK Cambé"/></div></div>
  <div class="form-row"><div><label>Razão social matriz</label><input id="razaoSocialMatriz" placeholder="Cadastro manual"/></div><div><label>CNPJ matriz</label><input id="cnpjMatriz" placeholder="Cadastro manual"/></div></div>
  <div class="form-row"><div><label>CNPJ da unidade que receberá a mercadoria</label><input id="cnpjUnidade" placeholder="Extraído do formulário"/></div><div><label>Ordem de compra do cliente</label><input id="ordemCompra" placeholder="Somente números"/></div></div>
  <div class="form-row"><div><label>Status</label><select id="status"><option value="anexar_os">Nova ART</option><option value="aguardando_engenheiro">Finalizado Engenheiro</option><option value="aguardando_aprovacao_cliente">Aguardando Aprovação Cliente</option><option value="solicitacao_alteracao">Solicitação de alteração</option><option value="financeiro">Financeiro</option></select></div><div><label>Observação</label><input id="observacao"/></div></div>
  <div class="form-row-3"><div><label>Nome da rua</label><input id="rua" onblur="validateCEP()"/></div><div><label>Nº</label><input id="numero"/></div><div><label>CEP</label><input id="cep" onblur="validateCEP()"/></div></div>
  <div class="form-row-3"><div><label>Cidade</label><input id="cidade"/></div><div><label>UF</label><input id="uf" maxlength="2"/></div><div><label>Aviso CEP</label><input id="cepAviso" readonly/></div></div><div id="cepBox"></div>
</div>
<div id="tab-pedido" class="tab-content"><label>Texto colado das informações do pedido</label><textarea id="textoPedido" placeholder="Cole aqui as informações do pedido. O PDF cadastro será gerado em tabela sem valores."></textarea></div>
<div id="tab-formulario" class="tab-content"><label>Texto colado do formulário de instalação</label><textarea id="textoFormulario" placeholder="Cole aqui todo o formulário de instalação. O sistema tentará extrair cliente, job, OC, endereço, CEP, cidade, UF e CNPJ da unidade."></textarea><button type="button" class="btn-muted" style="margin-top:10px" onclick="extractFromForm()">Extrair dados do formulário</button></div>
<button class="btn-dark" style="width:100%;margin-top:16px" type="submit">Salvar solicitação</button></form></div></div>
<div id="pdfArea" class="hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAvmkq8W92sO6ehIb6rB9fvqn_rCwVsGQE",authDomain:"controle-pendencias-d525e.firebaseapp.com",projectId:"controle-pendencias-d525e",storageBucket:"controle-pendencias-d525e.firebasestorage.app",messagingSenderId:"526501414683",appId:"1:526501414683:web:84370c06171ed8be94b5be",measurementId:"G-671442F78R"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const artsRef=collection(db,"solicitacoes_art_granda"); let arts=[];
const statuses=[{id:'anexar_os',title:'Nova ART',badge:'Nova',cls:'st-os'},{id:'aguardando_engenheiro',title:'Finalizado Engenheiro',badge:'ART',cls:'st-eng'},{id:'aguardando_aprovacao_cliente',title:'Aguardando Aprovação Cliente',badge:'Cliente',cls:'st-cli'},{id:'solicitacao_alteracao',title:'Solicitação de alteração',badge:'Alteração',cls:'st-alt'},{id:'financeiro',title:'Financeiro',badge:'Financeiro',cls:'st-fin'}];
function todayBR(){return new Date().toLocaleString('pt-BR')}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function onlyNums(v){return String(v||'').replace(/\D/g,'')}function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function clean(v){return String(v||'').replace(/^[:\-–—\s]+/,'').replace(/\s{2,}/g,' ').trim()}
function addBusinessDays(date,days){const result=new Date(date);let added=0;while(added<days){result.setDate(result.getDate()+1);const d=result.getDay();if(d!==0&&d!==6)added++}return result}function isoDate(date){return new Date(date).toISOString().split('T')[0]}function isLate(a){if(a.finalizado||!a.prazoEntrega)return false;const t=new Date();t.setHours(0,0,0,0);const p=new Date(a.prazoEntrega+'T00:00:00');return t>p}function deadlineText(a){if(a.finalizado)return `<span class="deadline-pill deadline-ok">Finalizado</span>`;if(!a.prazoEntrega)return '-';const t=new Date();t.setHours(0,0,0,0);const p=new Date(a.prazoEntrega+'T00:00:00');const diff=Math.ceil((p-t)/(1000*60*60*24));return diff<0?`<span class="deadline-pill deadline-late">Atrasado ${Math.abs(diff)} dia(s)</span>`:`<span class="deadline-pill deadline-ok">${diff} dia(s) restantes</span>`}
function getLineValue(text,keys){const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);for(const key of keys){const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('^\\s*'+escaped+'\\s*(?:[:\\-–—]|=)?\\s*(.+)$','i');for(let i=0;i<lines.length;i++){const line=lines[i];const m=line.match(re);if(m&&clean(m[1])&&norm(clean(m[1]))!==norm(key))return clean(m[1]);const n=norm(line),k=norm(key);if(n===k||n.startsWith(k+':')||n.startsWith(k+' -')||n.startsWith(k+' –')){const after=line.slice(key.length);if(clean(after))return clean(after);if(lines[i+1])return clean(lines[i+1])}}}return ''}
function getRegexValue(text,patterns){for(const p of patterns){const m=String(text||'').match(p);if(m&&m[1])return clean(m[1])}return ''}
window.showTab=function(name){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add('active');document.getElementById('tab-'+name).classList.add('active')}
window.extractFromForm=function(){const t=document.getElementById('textoFormulario').value;const all=t.replace(/\s+/g,' ');function set(id,val){if(val!==undefined&&val!==null&&String(val).trim())document.getElementById(id).value=String(val).trim()}const cliente=getLineValue(t,['Nome do cliente','Cliente','Razão social','Razao social'])||getRegexValue(all,[/nome do cliente\s*[:\-–—]?\s*([^|;\n]+?)(?=\s+(?:job|ordem de compra|endereço|endereco|rua|cep|cidade|uf)\b|$)/i]);const job=getLineValue(t,['Job','JOB','Número do job','Numero do job','Nº job','N° job'])||getRegexValue(all,[/\bjob\s*[:\-–—]?\s*([A-Za-z0-9.\/_-]+)/i]);let oc=getLineValue(t,['Ordem de compra do cliente','Ordem de compra','OC','O.C.','Pedido de compra']);if(!oc)oc=getRegexValue(all,[/(?:ordem de compra do cliente|ordem de compra|pedido de compra|\boc\b|o\.c\.)\D{0,25}(\d[\d.\/-]*)/i]);
const rua=getLineValue(t,['Nome da rua','Rua','Endereço','Endereco','Logradouro'])||getRegexValue(all,[/(?:nome da rua|endereço|endereco|logradouro|rua)\s*[:\-–—]?\s*([^,;|\n]+?)(?=\s+(?:n[º°o]|numero|número|cep|cidade|uf)\b|$)/i]);const numero=getLineValue(t,['Nº','N°','Número','Numero','N'])||getRegexValue(all,[/(?:n[º°o]?|número|numero)\s*[:\-–—]?\s*([0-9A-Za-z\/-]+)/i]);let cep=getLineValue(t,['CEP']);if(!cep){const m=all.match(/\b\d{5}-?\d{3}\b/);cep=m?m[0]:''}const cidade=getLineValue(t,['Cidade','Município','Municipio'])||getRegexValue(all,[/(?:cidade|município|municipio)\s*[:\-–—]?\s*([A-Za-zÀ-ÿ .'-]+?)(?=\s+(?:uf|estado|cep)\b|$)/i]);let uf=getLineValue(t,['UF','Estado']);if(!uf){const m=all.match(/\b(AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO)\b/i);uf=m?m[1]:''}let cnpj=getLineValue(t,['CNPJ da unidade que receberá a mercadoria','CNPJ da unidade','CNPJ unidade','CNPJ']);if(!cnpj){const m=all.match(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/);cnpj=m?m[0]:''}set('cliente',cliente);set('job',job);set('ordemCompra',onlyNums(oc));set('rua',rua);set('numero',numero);set('cep',cep);set('cidade',cidade);set('uf',uf.toUpperCase().slice(0,2));set('cnpjUnidade',cnpj);validateCEP();showTab('dados')}
window.validateCEP=async function(){const cep=onlyNums(document.getElementById('cep').value);const ruaDigitada=document.getElementById('rua').value.trim();const box=document.getElementById('cepBox');const aviso=document.getElementById('cepAviso');box.innerHTML='';aviso.value='';if(cep.length!==8)return;try{const res=await fetch(`https://viacep.com.br/ws/${cep}/json/`);const data=await res.json();if(data.erro){aviso.value='CEP não encontrado';box.innerHTML='<div class="alert alert-warn">CEP não encontrado.</div>';return}if(!document.getElementById('cidade').value)document.getElementById('cidade').value=data.localidade||'';if(!document.getElementById('uf').value)document.getElementById('uf').value=data.uf||'';if(ruaDigitada&&data.logradouro&& !norm(ruaDigitada).includes(norm(data.logradouro)) && !norm(data.logradouro).includes(norm(ruaDigitada))){aviso.value=`Divergência: CEP retorna ${data.logradouro}`;box.innerHTML=`<div class="alert alert-warn">Atenção: o CEP informado retorna "${esc(data.logradouro)}", diferente da rua digitada.</div>`}else{aviso.value='CEP conferido';box.innerHTML='<div class="alert alert-ok">CEP conferido.</div>'}}catch(e){console.error(e);aviso.value='Não foi possível validar o CEP'}}
function matches(a){const q=norm(document.getElementById('search').value);const uf=document.getElementById('filterUf').value;const hay=norm([a.cliente,a.job,a.ordemCompra,a.razaoSocialMatriz,a.cnpjMatriz,a.cnpjUnidade,a.rua,a.numero,a.cep,a.cidade,a.uf,a.textoPedido,a.textoFormulario].join(' '));return(!q||hay.includes(q))&&(!uf||a.uf===uf)}
function cardHTML(a,done=false){const prazoClass=isLate(a)?'prazo-atrasado':'prazo-ok';return `<div class="card ${prazoClass}" draggable="${!done}" ondragstart="dragStart(event,'${a.id}')"><h3>${esc(a.cliente||'Cliente não informado')}</h3><div class="meta"><div><b>Job:</b> ${esc(a.job||'-')}</div><div><b>OC:</b> ${esc(a.ordemCompra||'-')}</div><div><b>CNPJ unidade:</b> ${esc(a.cnpjUnidade||'-')}</div><div><b>Endereço:</b> ${esc([a.rua,a.numero].filter(Boolean).join(', ')||'-')}</div><div><b>Cidade/UF:</b> ${esc([a.cidade,a.uf].filter(Boolean).join(' / ')||'-')}</div><div><b>Prazo:</b> ${deadlineText(a)}</div></div>${a.observacao?`<div class="desc">${esc(a.observacao)}</div>`:''}<div class="actions">${!done?`<button class="btn-small btn-green" onclick="finishArt('${a.id}')">Finalizar</button>`:`<button class="btn-small btn-muted" onclick="reopenArt('${a.id}')">Reabrir</button>`}<button class="btn-small btn-muted" onclick="openEdit('${a.id}')">Editar</button><button class="btn-small btn-muted" onclick="generatePDF('${a.id}')">Gerar PDF cadastro</button><button class="btn-small btn-danger" onclick="deleteArt('${a.id}')">Excluir</button></div></div>`}
window.render=function(){const board=document.getElementById('board');board.innerHTML=statuses.map(s=>`<div class="column" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropCard(event,'${s.id}')"><div class="column-title">${s.title}<span class="badge ${s.cls}">${s.badge}</span></div><div class="cards" id="col_${s.id}"></div></div>`).join('');const filtered=arts.filter(matches);const map={anexar_os:'os',aguardando_engenheiro:'eng',aguardando_aprovacao_cliente:'cli',solicitacao_alteracao:'alt',financeiro:'fin'};for(const s of statuses){const arr=filtered.filter(a=>!a.finalizado&&(a.status||'anexar_os')===s.id);document.getElementById('col_'+s.id).innerHTML=arr.length?arr.map(a=>cardHTML(a)).join(''):'<div class="empty">Nenhuma solicitação nesta etapa.</div>';document.getElementById('count_'+map[s.id]).textContent=arts.filter(a=>!a.finalizado&&(a.status||'anexar_os')===s.id).length}const done=filtered.filter(a=>a.finalizado);document.getElementById('finishedGrid').innerHTML=done.length?done.map(a=>cardHTML(a,true)).join(''):'<div class="empty">Nenhuma ART finalizada ainda.</div>';document.getElementById('count_done').textContent=arts.filter(a=>a.finalizado).length}
window.dragStart=(e,id)=>e.dataTransfer.setData('text/plain',id);window.dragOver=e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')};window.dragLeave=e=>e.currentTarget.classList.remove('drag-over');window.dropCard=async(e,status)=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');if(!id)return;await updateDoc(doc(db,'solicitacoes_art_granda',id),{status,alteradoEm:todayBR()})};
window.openCreate=function(){document.getElementById('modalTitle').textContent='Nova solicitação de ART';document.getElementById('artForm').reset();document.getElementById('editId').value='';document.getElementById('cepBox').innerHTML='';showTab('dados');document.getElementById('modalBg').style.display='flex'};window.closeModal=()=>document.getElementById('modalBg').style.display='none';
window.openEdit=function(id){const a=arts.find(x=>x.id===id);if(!a)return;document.getElementById('modalTitle').textContent='Editar solicitação de ART';['cliente','job','razaoSocialMatriz','cnpjMatriz','cnpjUnidade','ordemCompra','rua','numero','cep','cidade','uf','observacao','textoPedido','textoFormulario','status','cepAviso'].forEach(k=>{const el=document.getElementById(k); if(el) el.value=a[k]||''});document.getElementById('editId').value=id;showTab('dados');document.getElementById('modalBg').style.display='flex'};
document.getElementById('artForm').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('editId').value;const item={cliente:document.getElementById('cliente').value.trim(),job:document.getElementById('job').value.trim(),razaoSocialMatriz:document.getElementById('razaoSocialMatriz').value.trim(),cnpjMatriz:document.getElementById('cnpjMatriz').value.trim(),cnpjUnidade:document.getElementById('cnpjUnidade').value.trim(),ordemCompra:onlyNums(document.getElementById('ordemCompra').value),rua:document.getElementById('rua').value.trim(),numero:document.getElementById('numero').value.trim(),cep:document.getElementById('cep').value.trim(),cidade:document.getElementById('cidade').value.trim(),uf:document.getElementById('uf').value.trim().toUpperCase().slice(0,2),observacao:document.getElementById('observacao').value.trim(),textoPedido:document.getElementById('textoPedido').value.trim(),textoFormulario:document.getElementById('textoFormulario').value.trim(),status:document.getElementById('status').value,cepAviso:document.getElementById('cepAviso').value.trim(),alteradoEm:todayBR()};try{if(id){await updateDoc(doc(db,'solicitacoes_art_granda',id),item)}else{await addDoc(artsRef,{...item,criadoEm:todayBR(),prazoEntrega:isoDate(addBusinessDays(new Date(),5)),criadoEmTimestamp:serverTimestamp(),finalizado:false,finalizadoEm:''})}closeModal()}catch(err){console.error('Erro Firebase:',err);alert('Não foi possível salvar no Firebase. Erro: '+(err.code||'')+' '+(err.message||''))}});
window.finishArt=async id=>{await updateDoc(doc(db,'solicitacoes_art_granda',id),{finalizado:true,finalizadoEm:todayBR()})};window.reopenArt=async id=>{await updateDoc(doc(db,'solicitacoes_art_granda',id),{finalizado:false,finalizadoEm:''})};window.deleteArt=async id=>{if(confirm('Deseja excluir esta solicitação de ART?'))await deleteDoc(doc(db,'solicitacoes_art_granda',id))};
function parsePedidoItens(texto){
  const linhas=String(texto||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const blocos=[];
  let atual=null;
  let esperado=1;
  const ignorarLinha=(linha)=>{
    if(/^\d+\/\d+$/.test(linha))return true;
    if(/^GRANDA COMUNICACAO VISUAL/i.test(linha))return true;
    if(/^CNPJ:/i.test(linha))return true;
    if(/^https?:\/\//i.test(linha))return true;
    if(/^ROD\s+/i.test(linha))return true;
    if(/^Telefone:/i.test(linha))return true;
    if(/^Ordem de serviço/i.test(linha))return true;
    if(/^Ref\.:/i.test(linha))return true;
    if(/^Item\s+Imagem\s+Descrição/i.test(linha))return true;
    if(/^\d{2}\/\d{2}\/\d{4}/.test(linha))return true;
    return false;
  };

  for(const linhaOriginal of linhas){
    const linha=linhaOriginal.trim();
    if(ignorarLinha(linha))continue;

    const inicio=linha.match(/^(\d{1,3})\s+(?![\d.,]+\s*(?:x|R\$|$))(?:\.\.\.\s*)?(.+)$/i);
    if(inicio){
      const numero=parseInt(inicio[1],10);
      if(numero===esperado || (esperado===1 && numero===1)){
        if(atual)blocos.push(atual);
        atual={item:String(numero),titulo:inicio[2].trim(),linhas:[linha]};
        esperado=numero+1;
        continue;
      }
    }

    if(atual)atual.linhas.push(linha);
  }
  if(atual)blocos.push(atual);

  return blocos.map(bloco=>{
    const textoBloco=bloco.linhas.join(' ').replace(/\s+/g,' ').trim();
    let titulo=String(bloco.titulo||'').replace(/^\.\.\.\s*/,'').trim();

    // Remove valores quando o item está todo em uma única linha, ex.: "TOTEM KIDS 1 2.400,00 R$ 2.400,00"
    titulo=titulo.replace(/\s+\d+\s+\d{1,3}(?:\.\d{3})*,\d{2}\s+R\$\s+\d{1,3}(?:\.\d{3})*,\d{2}\s*$/i,'').trim();
    titulo=titulo.replace(/\s+\d+\s+R\$\s+\d{1,3}(?:\.\d{3})*,\d{2}\s*$/i,'').trim();

    let medida='';
    let qtde='';

    // Captura padrão completo: medida + quantidade + valor unit + subtotal
    const padraoComValor=textoBloco.match(/(\d+(?:[\.,]\d+)?(?:\s*x\s*\d+(?:[\.,]\d+)?){0,2})\s+(\d+)\s+\d{1,3}(?:\.\d{3})*,\d{2}\s+R\$\s+\d{1,3}(?:\.\d{3})*,\d{2}/i);
    if(padraoComValor){
      medida=padraoComValor[1].replace(/\s*x\s*/gi,' x ');
      qtde=padraoComValor[2];
    }else{
      // Captura item sem medida, ex.: "TOTEM KIDS 1 2.400,00 R$ 2.400,00"
      const qtdComValor=textoBloco.match(/\s(\d+)\s+\d{1,3}(?:\.\d{3})*,\d{2}\s+R\$\s+\d{1,3}(?:\.\d{3})*,\d{2}/i);
      if(qtdComValor)qtde=qtdComValor[1];
    }

    return {item:bloco.item,descricao:titulo||'-',medida:medida||'-',qtde:qtde||'-'};
  });
}
function pedidoTableHTML(texto){const itens=parsePedidoItens(texto);if(!itens.length)return `<div>${esc(texto||'')}</div>`;return `<table class="pdf-table"><thead><tr><th>Item</th><th>Descrição</th><th>Medida</th><th>Qtde</th></tr></thead><tbody>${itens.map(i=>`<tr><td>${esc(i.item)}</td><td>${esc(i.descricao)}</td><td>${esc(i.medida||'-')}</td><td>${esc(i.qtde||'-')}</td></tr>`).join('')}</tbody></table>`}
function pdfHTML(a){const statusTitle=esc((statuses.find(s=>s.id===a.status)||{}).title||'');return `<div class="pdf-page"><h1>Dados para Emissão da ART - Granda</h1><div class="pdf-grid"><div class="pdf-box"><div class="pdf-label">Cliente</div><div class="pdf-value">${esc(a.cliente)}</div></div><div class="pdf-box"><div class="pdf-label">Job</div><div class="pdf-value">${esc(a.job)}</div></div><div class="pdf-box"><div class="pdf-label">Razão Social Matriz</div><div class="pdf-value">${esc(a.razaoSocialMatriz)}</div></div><div class="pdf-box"><div class="pdf-label">CNPJ Matriz</div><div class="pdf-value">${esc(a.cnpjMatriz)}</div></div><div class="pdf-box"><div class="pdf-label">CNPJ Unidade</div><div class="pdf-value">${esc(a.cnpjUnidade)}</div></div><div class="pdf-box"><div class="pdf-label">Ordem de compra</div><div class="pdf-value">${esc(a.ordemCompra)}</div></div><div class="pdf-box"><div class="pdf-label">Status</div><div class="pdf-value">${statusTitle}</div></div><div class="pdf-box"><div class="pdf-label">Endereço</div><div class="pdf-value">${esc([a.rua,a.numero].filter(Boolean).join(', '))}</div></div><div class="pdf-box"><div class="pdf-label">CEP / Cidade / UF</div><div class="pdf-value">${esc([a.cep,a.cidade,a.uf].filter(Boolean).join(' - '))}</div></div><div class="pdf-box"><div class="pdf-label">Aviso CEP</div><div class="pdf-value">${esc(a.cepAviso)}</div></div></div><h2>Informações do Pedido</h2>${pedidoTableHTML(a.textoPedido||'')}</div>`}
window.generatePDF=function(id){const a=arts.find(x=>x.id===id);if(!a)return;const area=document.getElementById('pdfArea');area.innerHTML=pdfHTML(a);area.classList.remove('hidden');html2pdf().set({margin:0,filename:`ART-${(a.cliente||'cliente').replace(/[^a-z0-9]/gi,'_')}-${a.job||''}.pdf`,image:{type:'jpeg',quality:.98},html2canvas:{scale:2},jsPDF:{unit:'px',format:[794,1123],orientation:'portrait'}}).from(area).save().then(()=>area.classList.add('hidden'))};
window.exportCSV=function(){const headers=['Cliente','Job','Razao Matriz','CNPJ Matriz','CNPJ Unidade','Ordem Compra','Rua','Numero','CEP','Cidade','UF','Status','Finalizado','Criado em'];const rows=arts.map(a=>[a.cliente,a.job,a.razaoSocialMatriz,a.cnpjMatriz,a.cnpjUnidade,a.ordemCompra,a.rua,a.numero,a.cep,a.cidade,a.uf,a.status,a.finalizado?'Sim':'Nao',a.criadoEm]);const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='solicitacoes-art-granda.csv';link.click()};
render();
onSnapshot(query(artsRef,orderBy('criadoEmTimestamp','desc')),snap=>{arts=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>{console.error(err);alert('Erro ao carregar dados do Firebase. Confira se as regras permitem leitura.')});
</script>
